# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=false
kotlin.code.style=official

# Memory is tuned for a ~7GB machine. A clean build packages ONNX Runtime for four
# ABIs, which pushed the previous -Xmx4g daemon (plus a separate Kotlin daemon and
# dex workers) past available RAM and got it OOM-killed by the kernel mid-build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g

# Single-module project: parallel execution buys nothing and doubles peak memory.
org.gradle.parallel=false
org.gradle.workers.max=2
